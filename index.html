<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Mário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <span id="score">Pontuação: 000000</span> 
        <span>&#9733; <span id="lives"></span></span>
        <span> COINS: <span id="coins">0</span></span>
    <span>WORLD 1-1</span>
    <span> TIME: <span id="time">400</span> </span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="Overlay"> 
        <h1 id="overlay-title">SUPER.MARIO</h1>
        <p id="overlay-msg"> Arrow.Keys / WASD to move <br> Space / Up / W to jump <br> Double-tap jump <br> 
        OR Shift + Jump for SUPER JUMP <p></p>
        <button id="overlay-btn">START GAME</button>
    </div>
    <script src="game.js" defer></script>
</body>
</html>
